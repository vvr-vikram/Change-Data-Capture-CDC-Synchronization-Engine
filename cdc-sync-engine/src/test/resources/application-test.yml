spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///orders_db?TC_INITSCRIPT=postgres/init.sql
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: update
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
logging:
  level:
    root: WARN
    com.example.cdcsync: DEBUG
